}

// A pair of curves representing the boundary of a trimmed surface in both global X, Y, Z coordinates (Curve3d) as well as local surface U, V parameter space (Curve2d).
// A Surface Trim is immutable to ensure compatiblity of both curves.
message SurfaceTrim {
  option (.bhom.message_info).csharp_type = "BH.oM.Geometry.SurfaceTrim";
  // Trim Curve in global X, Y, Z coordinates.
  ICurve curve3d = 10 [(.bhom.field_info).property = "Curve3d"];
  // Trim Curve in local surface U, V coordinates.
  ICurve curve2d = 11 [(.bhom.field_info).property = "Curve2d"];
}

// A standard solid circular ring torus, formed as a surface of revolution of a circle about an axis.
message Torus {
  option (.bhom.message_info).csharp_type = "BH.oM.Geometry.Torus";
  // Origin point defining location of the Torus in three-dimensional space.
  Point centre = 10 [(.bhom.field_info).property = "Centre"];
  // Vector defining the axis of revolution and the orientation of the Torus in three-dimensional space.
  Vector axis = 11 [(.bhom.field_info).property = "Axis"];
  // Distance from the Torus Centre (and the axis of revolution) to the centre of the circular cross section.
  double radius_major = 12 [(.bhom.field_info).property = "RadiusMajor"];  // [Length, m]
  // The radius defining the size of the circular cross section.
  double radius_minor = 13 [(.bhom.field_info).property = "RadiusMinor"];  // [Length, m]
}

// A 4x4 matrix describing linear tranformations in three-dimensional space, such as translations, rotations, reflections, scaling and shearing.
message TransformMatrix {
  option (.bhom.message_info).csharp_type = "BH.oM.Geometry.TransformMatrix";
  repeated ListOfDouble matrix = 10 [(.bhom.field_info).property = "Matrix"];
}

// Defines a direction and magnitude in three-dimensional Euclidean space.
message Vector {
  option (.bhom.message_info).csharp_type = "BH.oM.Geometry.Vector";
  // Dimension along global X coordinate axis.
  double x = 10 [(.bhom.field_info).property = "X"];  // [Length, m]
  // Dimension along global Y coordinate axis.
  double y = 11 [(.bhom.field_info).property = "Y"];  // [Length, m]
  // Dimension along global Z coordinate axis.
  double z = 12 [(.bhom.field_info).property = "Z"];  // [Length, m]
}

// ---- Helper wrappers (protobuf cannot nest 'repeated' directly) ----

message ListOfDouble {
  repeated double items = 1;
}

