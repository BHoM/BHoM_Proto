// Structural material of standard construction Timber to be used on structural elements and properties, or as a fragment of the physical material.
message SawnTimber {
  option (.bhom.message_info).csharp_type = "BH.oM.Structure.MaterialFragments.SawnTimber";
  string bhom_guid = 1 [(.bhom.field_info).property = "BHoM_Guid"];
  // A unique name is required for some structural packages to create and identify the object.
  string name = 2 [(.bhom.field_info).property = "Name"];
  repeated google.protobuf.Any fragments = 3 [(.bhom.field_info) = { property: "Fragments" any_of: "BH.oM.Base.IFragment" }];  // FragmentSet
  repeated string tags = 4 [(.bhom.field_info).property = "Tags"];  // unique values
  map<string, google.protobuf.Any> custom_data = 5 [(.bhom.field_info).property = "CustomData"];  // values are BHoM messages, google.protobuf wrappers, or google.protobuf.Struct/ListValue
  // Mean Density. Used to calculate mass. Called ρmean in Eurocode.
  double density = 10 [(.bhom.field_info).property = "Density"];  // [Density, kg/m³]
  // Characteristic Density. Used to calculate other mechanical properties (not mass). Called ρk in Eurocode.
  double density_characteristic = 11 [(.bhom.field_info).property = "DensityCharacteristic"];  // [Density, kg/m³]
  // Dynamic Damping Ratio. Ratio between actual damping and critical damping.
  double damping_ratio = 12 [(.bhom.field_info).property = "DampingRatio"];  // [Ratio, -]
  // Modulus Of Elasticity of the material to be used for Analysis. Ratio between stress and strain in all directions.
  // Values can be automatically populated based on material parameters by calling the SetAnalysisParameters method.
  // Vector defines stiffnesses as follows:
  // X - Stiffness along the local x-axis of the element (Ex). For most cases this will be the parallel stiffness.
  // Y - Stiffness along the local y-axis of the element (Ey). For most cases this will be the perpendicular stiffness.
  // Z - Stiffness along the local z-axis of the element (Ez). For most cases this will be the perpendicular stiffness.
  .bhom.geometry.Vector youngs_modulus = 13 [(.bhom.field_info).property = "YoungsModulus"];  // [YoungsModulus, Pa]
  // Shear Modulus or Modulus of Rigidity of the material to be used for Analysis. Ratio between shear stress and shear strain.
  // Values can be automatically populated based on material parameters by calling the SetAnalysisParameters method.
  // Vector components defined as:
  // X - Shear Modulus in the local xy-plane (Gxy).
  // Y - Shear Modulus in the local yz-plane (Gyz), generally referred to as rolling shear.
  // Z - Shear Modulus in the local zx-plane (Gzx).
  .bhom.geometry.Vector shear_modulus = 14 [(.bhom.field_info).property = "ShearModulus"];  // [ShearModulus, Pa]
  // Poisson's Ratio. Ratio between axial and transverse strain. Typically taken as 0.4 for X and Y component (νxy and νyz) and as 0.4*E_90/E_0 for the Z component, though value varies depending on timber species.
  // Vector components made up of:
  // X - Poisson's ratio for strain in the local y direction generated by unit strain in x direction (νxy). Generally strain in perpendicular direction caused by strain in longitudinal direction.
  // Y - Poisson's ratio for strain in the local z direction generated by unit strain in y direction (νyz). Generally strain in perpendicular direction caused by strain in other perpendicular direction.
  // Z - Poisson's ratio for strain in the local x direction generated by unit strain in z direction (νzx). Generally strain in longitudinal direction caused by strain in perpendicular direction. Note that this value generally is significantly lower than values for the other two components.
  .bhom.geometry.Vector poissons_ratio = 15 [(.bhom.field_info).property = "PoissonsRatio"];  // [Ratio, -]
  // Thermal Expansion Coefficeint. Strain induced in the material per unit change of temperature. Typically taken as 5x10^-6 in all directions, though value varies depending on timber species and grain orientation.
  // Vector defines stiffnesses as follows:
  // X - Thermal expansion along the local x-axis of the element (αx).
  // Y - Thermal expansion along the local y-axis of the element (αy).
  // Z - Thermal expansion along the local z-axis of the element (αz).
  .bhom.geometry.Vector thermal_expansion_coeff = 16 [(.bhom.field_info).property = "ThermalExpansionCoeff"];  // [ThermalExpansionCoefficient, 1/K]
  // Mean modulus of elasticity parallel bending, Em,0,mean in Eurocode.
  double e_0_mean = 17 [(.bhom.field_info).property = "E_0_Mean"];  // [YoungsModulus, Pa]
  // 5 percentile modulus of elasticity parallel bending, Em,0,k in Eurocode.
  double e_0_k = 18 [(.bhom.field_info).property = "E_0_k"];  // [YoungsModulus, Pa]
  // Mean modulus of elasticity perpendicular, Em,90,mean in Eurocode.
  double e_90_mean = 19 [(.bhom.field_info).property = "E_90_Mean"];  // [YoungsModulus, Pa]
  // Mean shear modulus, G,mean in Eurocode.
  double g_mean = 20 [(.bhom.field_info).property = "G_Mean"];  // [ShearModulus, Pa]
  // Characteristic Bending Strength. Normal stress parallel to the grain at failure in bending as calculated from beam equations. Called f_mk in Eurocode.
  double bending_strength = 21 [(.bhom.field_info).property = "BendingStrength"];  // [Stress, Pa]
  // Characteristic Tensile parallel Strength. Tensile stress parallel to the grain at failure in net tension. Called  f_t0k in Eurocode.
  double tensile_strength_parallel = 22 [(.bhom.field_info).property = "TensileStrengthParallel"];  // [Stress, Pa]
  // Characteristic Tensile perpendicular Strength. Tensile stress perpendicular to the grain at failure in net tension. Called f_t90k in Eurocode.
  double tensile_strength_perpendicular = 23 [(.bhom.field_info).property = "TensileStrengthPerpendicular"];  // [Stress, Pa]
  // Characteristic Compressive parallel Strength. Compressive stress parallel to the grain at failure in net compression. Called f_c0k in Eurocode.
  double compressive_strength_parallel = 24 [(.bhom.field_info).property = "CompressiveStrengthParallel"];  // [Stress, Pa]
  // Characteristic Compressive perpendicular Strength. Compressive stress perpendicular to the grain at failure in net compression. Called f_c90k in Eurocode.
  double compressive_strength_perpendicular = 25 [(.bhom.field_info).property = "CompressiveStrengthPerpendicular"];  // [Stress, Pa]
  // Characteristic Shear Strength. Shear stress parallel to the grain at failure in net shear, i.e. shear relevant to beam bending. Called f_vk in Eurocode.
  double shear_strength = 26 [(.bhom.field_info).property = "ShearStrength"];  // [Stress, Pa]
}

