// 1D finite element for structural analysis. Linear 2-noded element defined by a start and end node.For structural conventions and orientation of the bar please see the documentation.
message Bar {
  option (.bhom.csharp_type) = "BH.oM.Structure.Elements.Bar";
  string bhom_guid = 1 [(.bhom.property) = "BHoM_Guid"];
  string name = 2 [(.bhom.property) = "Name"];
  // Fragments is not exchanged: IFragment is implemented in other files.
  reserved 3;
  option (.bhom.reserved_member) = "Fragments=3";
  repeated string tags = 4 [(.bhom.property) = "Tags"];  // unique values
  map<string, google.protobuf.Any> custom_data = 5 [(.bhom.property) = "CustomData"];  // values are BHoM messages, google.protobuf wrappers, or google.protobuf.Struct/ListValue
  // Defines the start position of the element. Note that Nodes can contain Supports which should not be confused with Releases.
  Structure_Elements_Node start = 10 [(.bhom.property) = "Start"];
  // Defines the end position of the element. Note that Nodes can contain Supports which should not be confused with Releases.
  Structure_Elements_Node end = 11 [(.bhom.property) = "End"];
  // Section property of the bar, containing all sectional constants and material as well as profile geometry and dimensions, where applicable.
  ISectionProperty section_property = 12 [(.bhom.property) = "SectionProperty"];
  // Controls the local axis orientation of the bar
  // For non-vertical members the local z is aligned with the global Z and rotated with the orientation angle about the local x.
  // For vertical members the local y is aligned with the global Y and rotated with the orientation angle about the local x.
  // A bar is vertical if its projected length to the horizontal plane is less than 0.0001, i.e. a tolerance of 0.1mm on verticality.
  // For general structural conventions please see the documentation.
  double orientation_angle = 13 [(.bhom.property) = "OrientationAngle"];  // [Angle, rad]
  // Defines the start and end release of the Bar. The releases defines how the bar is attached to its end nodes. If not set, full fixity will be assumed.
  BarRelease release = 14 [(.bhom.property) = "Release"];
  BarFEAType fea_type = 15 [(.bhom.property) = "FEAType"];
  // Linear support for the bar. Three translational degrees of freedom and one rotational. The rotational DOF defines constraint about the axis of the bar.
  Constraint4DOF support = 16 [(.bhom.property) = "Support"];
  // Offset of the bar as two vectors, one per end node, in bar local coordinates. Defines offsets from centreline to be applied in analysis packages.
  Structure_Offsets_Offset offset = 17 [(.bhom.property) = "Offset"];
}

