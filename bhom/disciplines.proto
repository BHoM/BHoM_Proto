// Structural timber material of type Glued Laminated Timber to be used on structural elements and properties, or as a fragment of the physical material.
message Glulam {
  option (.bhom.csharp_type) = "BH.oM.Structure.MaterialFragments.Glulam";
  string bhom_guid = 1 [(.bhom.property) = "BHoM_Guid"];
  // A unique name is required for some structural packages to create and identify the object.
  string name = 2 [(.bhom.property) = "Name"];
  // Fragments is not exchanged: IFragment is implemented in other files.
  reserved 3;
  option (.bhom.reserved_member) = "Fragments=3";
  repeated string tags = 4 [(.bhom.property) = "Tags"];  // unique values
  map<string, google.protobuf.Any> custom_data = 5 [(.bhom.property) = "CustomData"];  // values are BHoM messages, google.protobuf wrappers, or google.protobuf.Struct/ListValue
  // Mean Density. Used to calculate mass. Called ρg,mean in Eurocode.
  double density = 10 [(.bhom.property) = "Density"];  // [Density, kg/m³]
  // Characteristic Density. Used to calculate other mechanical properties (not mass). Called ρg,k in Eurocode.
  double density_characteristic = 11 [(.bhom.property) = "DensityCharacteristic"];  // [Density, kg/m³]
  // Dynamic Damping Ratio. Ratio between actual damping and critical damping.
  double damping_ratio = 12 [(.bhom.property) = "DampingRatio"];  // [Ratio, -]
  // Modulus Of Elasticity of the material to be used for Analysis. Ratio between stress and strain in all directions.
  // Values can be automatically populated based on material parameters by calling the SetAnalysisParameters method.
  // Vector defines stiffnesses as follows:
  // X - Stiffness along the local x-axis of the element (Ex). For most cases this will be the parallel stiffness (E_0).
  // Y - Stiffness along the local y-axis of the element (Ey). For most cases this will be the perpendicular stiffness (E_90).
  // Z - Stiffness along the local z-axis of the element (Ez). For most cases this will be the perpendicular stiffness (E_90).
  .bhom.geometry.Vector youngs_modulus = 13 [(.bhom.property) = "YoungsModulus"];  // [YoungsModulus, Pa]
  // Shear Modulus or Modulus of Rigidity of the material to be used for Analysis. Ratio between shear stress and shear strain.
  // Values can be automatically populated based on material parameters by calling the SetAnalysisParameters method.
  // Vector components defined as:
  // X - Shear Modulus in the local xy-plane (Gxy). For most cases this will be the Shear modulus (G_k or G_Mean)
  // Y - Shear Modulus in the local yz-plane (Gyz). For most cases this will be the Rolling Shear modulus (Gr_k or Gr_Mean)
  // Z - Shear Modulus in the local zx-plane (Gzx). For most cases this will be the Shear modulus (G_k or G_Mean)
  .bhom.geometry.Vector shear_modulus = 14 [(.bhom.property) = "ShearModulus"];  // [ShearModulus, Pa]
  // Poisson's Ratio. Ratio between axial and transverse strain. Typically taken as 0.4 for X and Y component (νxy and νyz) and as 0.4*E_90/E_0 for the Z component, though value varies depending on timber species.
  // Vector components made up of:
  // X - Poisson's ratio for strain in the local y direction generated by unit strain in x direction (νxy). Generally strain in perpendicular direction caused by strain in longitudinal direction.
  // Y - Poisson's ratio for strain in the local z direction generated by unit strain in y direction (νyz). Generally strain in perpendicular direction caused by strain in other perpendicular direction.
  // Z - Poisson's ratio for strain in the local x direction generated by unit strain in z direction (νzx). Generally strain in longitudinal direction caused by strain in perpendicular direction. Note that this value generally is significantly lower than values for the other two components.
  .bhom.geometry.Vector poissons_ratio = 15 [(.bhom.property) = "PoissonsRatio"];  // [Ratio, -]
  // Thermal Expansion Coefficeint. Strain induced in the material per unit change of temperature. Typically taken as 5x10^-6 in all directions, though value varies depending on timber species and grain orientation.
  // Vector defines stiffnesses as follows:
  // X - Thermal expansion along the local x-axis of the element (αx).
  // Y - Thermal expansion along the local y-axis of the element (αy).
  // Z - Thermal expansion along the local z-axis of the element (αz).
  .bhom.geometry.Vector thermal_expansion_coeff = 16 [(.bhom.property) = "ThermalExpansionCoeff"];  // [ThermalExpansionCoefficient, 1/K]
  // Mean modulus of elasticity parallel bending, E0,mean in Eurocode.
  double e_0_mean = 17 [(.bhom.property) = "E_0_Mean"];  // [YoungsModulus, Pa]
  // 5 percentile modulus of elasticity parallel bending, E0,05 in Eurocode.
  double e_0_k = 18 [(.bhom.property) = "E_0_k"];  // [YoungsModulus, Pa]
  // Mean modulus of elasticity perpendicular, E90,mean in Eurocode.
  double e_90_mean = 19 [(.bhom.property) = "E_90_Mean"];  // [YoungsModulus, Pa]
  // Mean modulus of elasticity perpendicular, E90,05 in Eurocode.
  double e_90_k = 20 [(.bhom.property) = "E_90_k"];  // [YoungsModulus, Pa]
  // Mean shear modulus parallel to the grain, Gg,mean in Eurocode.
  double g_mean = 21 [(.bhom.property) = "G_Mean"];  // [ShearModulus, Pa]
  // Characteristic shear modulus parallel to the grain, Gg,05 in Eurocode.
  double g_k = 22 [(.bhom.property) = "G_k"];  // [ShearModulus, Pa]
  // Mean shear modulus parallel to the grain, Gr,mean in Eurocode.
  double gr_mean = 23 [(.bhom.property) = "Gr_Mean"];  // [ShearModulus, Pa]
  // Characteristic shear modulus parallel to the grain, Gr,05 in Eurocode.
  double gr_k = 24 [(.bhom.property) = "Gr_k"];  // [ShearModulus, Pa]
  // Characteristic Bending Strength. Normal stress parallel to the grain at failure in bending as calculated from beam equations. Called fm,k in Eurocode.
  double bending_strength = 25 [(.bhom.property) = "BendingStrength"];  // [Stress, Pa]
  // Characteristic Tensile parallel Strength. Tensile stress parallel to the grain at failure in net tension. Called ft,0,k in Eurocode.
  double tensile_strength_parallel = 26 [(.bhom.property) = "TensileStrengthParallel"];  // [Stress, Pa]
  // Characteristic Tensile perpendicular Strength. Tensile stress perpendicular to the grain at failure in net tension. Called ft,90,k in Eurocode.
  double tensile_strength_perpendicular = 27 [(.bhom.property) = "TensileStrengthPerpendicular"];  // [Stress, Pa]
  // Characteristic Compressive parallel Strength. Compressive stress parallel to the grain at failure in net compression. Called fc,0,k in Eurocode.
  double compressive_strength_parallel = 28 [(.bhom.property) = "CompressiveStrengthParallel"];  // [Stress, Pa]
  // Characteristic Compressive perpendicular Strength. Compressive stress perpendicular to the grain at failure in net compression. Called fc,90,k in Eurocode.
  double compressive_strength_perpendicular = 29 [(.bhom.property) = "CompressiveStrengthPerpendicular"];  // [Stress, Pa]
  // Characteristic Shear Strength. Shear stress parallel to the grain at failure in net shear, i.e. shear relevant to beam bending. Called fv,k in Eurocode.
  double shear_strength = 30 [(.bhom.property) = "ShearStrength"];  // [Stress, Pa]
  // Characteristic Rolling Shear Strength. Shear stress perpendicular to the grain at failure in net shear. Called fr,k in Eurocode.
  double rolling_shear_strength = 31 [(.bhom.property) = "RollingShearStrength"];  // [Stress, Pa]
}

// Base interface for structural materials used by structural properties or as a fragment of the physical material.
// C# interface: BH.oM.Structure.MaterialFragments.IMaterialFragment
message IMaterialFragment {
  option (.bhom.csharp_type) = "BH.oM.Structure.MaterialFragments.IMaterialFragment";
  oneof value {
    Aluminium aluminium = 1;
    Concrete concrete = 2;
    GenericIsotropicMaterial generic_isotropic_material = 3;
    GenericOrthotropicMaterial generic_orthotropic_material = 4;
    Glulam glulam = 5;
    LaminatedVeneerLumberCrossbands laminated_veneer_lumber_crossbands = 6;
    LaminatedVeneerLumberParallel laminated_veneer_lumber_parallel = 7;
    SawnTimber sawn_timber = 8;
    Steel steel = 9;
    Timber timber = 10;
  }
}

// Structural timber material of type Laminated Veneer Lumber with crossband veneers. To be used on structural elements and properties, or as a fragment of the physical material.
// Note: Properties for LVL are not part of a harmonised standard and therefore vary between manufacturers and products.
message LaminatedVeneerLumberCrossbands {
  option (.bhom.csharp_type) = "BH.oM.Structure.MaterialFragments.LaminatedVeneerLumberCrossbands";
  string bhom_guid = 1 [(.bhom.property) = "BHoM_Guid"];
  // A unique name is required for some structural packages to create and identify the object.
  string name = 2 [(.bhom.property) = "Name"];
  // Fragments is not exchanged: IFragment is implemented in other files.
  reserved 3;
  option (.bhom.reserved_member) = "Fragments=3";
  repeated string tags = 4 [(.bhom.property) = "Tags"];  // unique values
  map<string, google.protobuf.Any> custom_data = 5 [(.bhom.property) = "CustomData"];  // values are BHoM messages, google.protobuf wrappers, or google.protobuf.Struct/ListValue
  // Mean Density. Used to calculate mass. Called ρmean in most manufacturer documentation.
  double density = 10 [(.bhom.property) = "Density"];  // [Density, kg/m³]
  // Characteristic Density. Used to calculate other mechanical properties (not mass). Called ρk in most manufacturer documentation.
  double density_characteristic = 11 [(.bhom.property) = "DensityCharacteristic"];  // [Density, kg/m³]
  // Dynamic Damping Ratio. Ratio between actual damping and critical damping.
  double damping_ratio = 12 [(.bhom.property) = "DampingRatio"];  // [Ratio, -]
  // Modulus Of Elasticity of the material to be used for Analysis. Ratio between stress and strain in all directions.
  // Values can be automatically populated based on material parameters by calling the SetAnalysisParameters method.
  // Vector defines stiffnesses as follows:
  // X - Stiffness along the local x-axis of the element. For most cases this will be the parallel stiffness (E_0).
  // Y - Stiffness along the local y-axis of the element. For most cases this will be parallel to the transverse grain direction (E_90_edge) for Flatwise and perpendicular to the glue-planes (E_90_flat) for Edgewise. For most beam/slab element cases this this will be the horizontal perpendicular stiffness.
  // Z - Stiffness along the local z-axis of the element. For most cases this will be perpendicular to the glue-planes (E_90_flat) for Flatwise and parallel to the transverse grain direction (E_90_edge) for Edgewise. For most beam/slab element cases this this will be the vertical perpendicular stiffness.
  .bhom.geometry.Vector youngs_modulus = 13 [(.bhom.property) = "YoungsModulus"];  // [YoungsModulus, Pa]
  // Shear Modulus or Modulus of Rigidity of the material to be used for Analysis. Ratio between shear stress and shear strain.
  // Values can be automatically populated based on material parameters by calling the SetAnalysisParameters method.
  // Vector components defined as:
  // X - Shear Modulus in the local xy-plane (Gxy). For most cases this will parallel shear modulus (G_0) - For flatwise use this will be G_0_Edge, for Edgewise use this will be G_0_Flat.
  // Y - Shear Modulus in the local yz-plane (Gyz). For most cases this will be the perpendicular shear modulus - For both flatwise and edgewise G_90_flat.
  // Z - Shear Modulus in the local zx-plane (Gzx). For most cases this will parallel shear modulus (G_0) - For flatwise use this will be G_0_Flat, for Edgewise use this will be G_0_Edge.
  .bhom.geometry.Vector shear_modulus = 14 [(.bhom.property) = "ShearModulus"];  // [ShearModulus, Pa]
  // Poisson's Ratio. Ratio between axial and transverse strain. Typically taken as 0.4 for X and Y component (νxy and νyz) and as 0.4*E_90/E_0 for the Z component, though value varies depending on timber species.
  // Vector components made up of:
  // X - Poisson's ratio for strain in the local y direction generated by unit strain in x direction (νxy). Generally strain in perpendicular direction caused by strain in longitudinal direction.
  // Y - Poisson's ratio for strain in the local z direction generated by unit strain in y direction (νyz). Generally strain in perpendicular direction caused by strain in other perpendicular direction.
  // Z - Poisson's ratio for strain in the local x direction generated by unit strain in z direction (νzx). Generally strain in longitudinal direction caused by strain in perpendicular direction. Note that this value generally is significantly lower than values for the other two components.
  .bhom.geometry.Vector poissons_ratio = 15 [(.bhom.property) = "PoissonsRatio"];  // [Ratio, -]
  // Thermal Expansion Coefficeint. Strain induced in the material per unit change of temperature. Typically taken as 5x10^-6 in all directions, though value varies depending on timber species, grain orientation and lamination.
  // Vector defines stiffnesses as follows:
  // X - Thermal expansion along the local x-axis of the element (αx).
  // Y - Thermal expansion along the local y-axis of the element (αy).
  // Z - Thermal expansion along the local z-axis of the element (αz).
  .bhom.geometry.Vector thermal_expansion_coeff = 16 [(.bhom.property) = "ThermalExpansionCoeff"];  // [ThermalExpansionCoefficient, 1/K]
  // Characteristic modulus of elasticity parallel to grain, E0,k in most manufacturer documentation. Value same for Em,0,edge,k, Em,0,flat,k, Et,0,k, and Ec,0,k.
  double e_0_k = 17 [(.bhom.property) = "E_0_k"];  // [YoungsModulus, Pa]
  // Characteristic modulus of elasticity for flatwise compression and tension perpendicular to the grain, Ec,90,flat,k and Et,90,flat,k in most manufacturer documentation.
  double e_90_flat_k = 18 [(.bhom.property) = "E_90_Flat_k"];  // [YoungsModulus, Pa]
  // Characteristic modulus of elasticity for flatwise bending perpendicular to the grain, Em,90,flat,k in most manufacturer documentation.
  // Stiffness direction same as E_90_Edge_k. Load condition should define which of the two to be used in analysis.
  double e_90_m_k = 19 [(.bhom.property) = "E_90_m_k"];  // [YoungsModulus, Pa]
  // Characteristic modulus of elasticity for edgewise axialforce perpendicular to the grain, Ec,90,edge,k and Et,90,edge,k in most manufacturer documentation.
  // Stiffness direction same as E_90_m_k. Load condition should define which of the two to be used in analysis.
  double e_90_edge_k = 20 [(.bhom.property) = "E_90_Edge_k"];  // [YoungsModulus, Pa]
  // Mean modulus of elasticity parallel to grain, E0,mean in most manufacturer documentation. Value same for Em,0,edge,mean, Em,0,flat,mean, Et,0,mean, and Ec,0,mean.
  double e_0_mean = 21 [(.bhom.property) = "E_0_Mean"];  // [YoungsModulus, Pa]
  // Mean modulus of elasticity for flatwise compression and tension perpendicular to the grain, Ec,90,flat,mean and Et,90,flat,mean in most manufacturer documentation.
  double e_90_flat_mean = 22 [(.bhom.property) = "E_90_Flat_Mean"];  // [YoungsModulus, Pa]
  // Mean modulus of elasticity for flatwise bending perpendicular to the grain, Em,90,flat,mean in most manufacturer documentation.
  // Stiffness direction same as E_90_Edge_Mean. Load condition should define which of the two to be used in analysis.
  double e_90_m_mean = 23 [(.bhom.property) = "E_90_m_Mean"];  // [YoungsModulus, Pa]
  // Mean modulus of elasticity for edgewise axialforce perpendicular to the grain, Ec,90,edge,mean and Et,90,edge,mean in most manufacturer documentation.
  // Stiffness direction same as E_90_m_Mean. Load condition should define which of the two to be used in analysis.
  double e_90_edge_mean = 24 [(.bhom.property) = "E_90_Edge_Mean"];  // [YoungsModulus, Pa]
  // Characteristic shear modulus for edgewise shear parallel to the grain, G0,edge,k in most manufacturer documentation.
  double g_0_edge_k = 25 [(.bhom.property) = "G_0_Edge_k"];  // [ShearModulus, Pa]
  // Characteristic shear modulus for flatwise shear parallel to the grain, G0,flat,k in most manufacturer documentation.
  double g_0_flat_k = 26 [(.bhom.property) = "G_0_Flat_k"];  // [ShearModulus, Pa]
  // Characteristic shear modulus for flatwise shear perpendicular to the grain, G90,flat,k in most manufacturer documentation.
  double g_90_flat_k = 27 [(.bhom.property) = "G_90_Flat_k"];  // [ShearModulus, Pa]
