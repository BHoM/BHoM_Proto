  // The sensible heat contributed by equipment, which contributes to a rise in temperature with no change in phase.
  double sensible = 10 [(.bhom.property) = "Sensible"];
  // The latent heat contributed by equipment, which contributes to a change in phase from solid to liquid.
  double latent = 11 [(.bhom.property) = "Latent"];
  // Profiles depict the time period (hours per day, days per week) during which equipment is contributing heat to the space.
  Profile profile = 12 [(.bhom.property) = "Profile"];
