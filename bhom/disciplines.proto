  // True means that a Z-translation imposes a rigid X-axis rotation.
  bool zto_xx = 17 [(.bhom.property) = "ZtoXX"];
  // True means that a Z-translation imposes a rigid Y-axis rotation.
  bool zto_yy = 18 [(.bhom.property) = "ZtoYY"];
  // True defines a rigid connectivity between primary and secondary nodes for rotations about the X-axis, i.e. true prohibits relative rotation about the X-axis between primary and secondary nodes.
  bool x_xto_xx = 19 [(.bhom.property) = "XXtoXX"];
