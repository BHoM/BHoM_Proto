// A space object is an analytical depiction of a room defined by its environmental conditions (internal gains)
message Space {
  option (.bhom.csharp_type) = "BH.oM.Environment.Elements.Space";
  string bhom_guid = 1 [(.bhom.property) = "BHoM_Guid"];
  string name = 2 [(.bhom.property) = "Name"];
  // Fragments is not exchanged: IFragment is implemented in other files.
  reserved 3;
  option (.bhom.reserved_member) = "Fragments=3";
  repeated string tags = 4 [(.bhom.property) = "Tags"];  // unique values
  map<string, google.protobuf.Any> custom_data = 5 [(.bhom.property) = "CustomData"];  // values are BHoM messages, google.protobuf wrappers, or google.protobuf.Struct/ListValue
  // Zones denotes the list of zones that this particular space is associated with. Zones are collections of spaces with similar internal gains and exterior envelope conditions.
  repeated string zones = 10 [(.bhom.property) = "Zones"];
  // Lighting gains are objects that are defined as the amount of heat contributed by light fixtures within the space
  repeated Lighting lighting_gain = 11 [(.bhom.property) = "LightingGain"];
  // Equipment gains are objects that are defined as the amount of heat contributed by equipment within the space
  repeated Equipment equipment_gain = 12 [(.bhom.property) = "EquipmentGain"];
  // People gains are objects that are defined as the amount of heat contributed by people based on their assumed activity level within the space (dancing, sitting, etc)
  repeated People people_gain = 13 [(.bhom.property) = "PeopleGain"];
  // Infiltration gains are objects that are defined as the amount of heat or heat loss contributed by cracks in the exterior envelope of the building which allow unconditioned outside air to be introduced to the space
  repeated Infiltration infiltration = 14 [(.bhom.property) = "Infiltration"];
  // Ventilation are objects that define the amount of outside air that should be introduced to a space, which is typically based on the number of occupants breathing the air and the area of the space.
  repeated Ventilation ventilation = 15 [(.bhom.property) = "Ventilation"];
  // Exhaust are objects that define the amount of air that should be extracted from a space, which is either based on the objects within the space (toilets, showers) or the space type (kitchen, bathroom).
  repeated Exhaust exhaust = 16 [(.bhom.property) = "Exhaust"];
  // Occupant Density is an object that defines the area occupied by each individual in a space (2 m2 per person).
  Occupancy occupant_density = 17 [(.bhom.property) = "OccupantDensity"];
  // Acoustics for an Environments Space define the noise within the space, by noise created by the velocity of the air within the ducts in the space, the Noise Rating, and decibel.
  Acoustics acoustics = 18 [(.bhom.property) = "Acoustics"];
  // The plumbing attributes of a space are indicative of the amount of cold water, hot water and waste required by a space, as well as requirements for vent, floor drains, hose bibs or natural gas.
  Plumbing plumbing = 19 [(.bhom.property) = "Plumbing"];
  // The fire protection attributes of a space are indicative of the hazard level of the space (which influences the sprinkler count), the sprinkler system type required, and the presence of combustible materials or sloped ceilings.
  FireProtection fire_protection = 20 [(.bhom.property) = "FireProtection"];
  // Project Space Type is a string that defines how the space is used on a given project (Museum, Corridor, etc)
  string project_space_type = 21 [(.bhom.property) = "ProjectSpaceType"];
  // Space Type is an enum that defines how the space is used (Museum, Corridor, etc)
  SpaceType space_type = 22 [(.bhom.property) = "SpaceType"];
  // A point in 3D space providing a location point of the space
  .bhom.geometry.Point location = 23 [(.bhom.property) = "Location"];
  // A 2D curve defining the external boundaries of the floor of the space
  .bhom.geometry.ICurve perimeter = 24 [(.bhom.property) = "Perimeter"];
}

