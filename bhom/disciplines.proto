  double radiant_fraction = 13 [(.bhom.property) = "RadiantFraction"];
}

// Exhaust is indicative of the amount of air that should be extracted from a space based on the space type (eg laboratory, woodshop) or fixtures contained within the space (eg toilets, showers)
message Exhaust {
  option (.bhom.csharp_type) = "BH.oM.Environment.SpaceCriteria.Exhaust";
  string bhom_guid = 1 [(.bhom.property) = "BHoM_Guid"];
  string name = 2 [(.bhom.property) = "Name"];
  // Fragments is not exchanged: IFragment is implemented in other files.
  reserved 3;
  option (.bhom.reserved_member) = "Fragments=3";
  repeated string tags = 4 [(.bhom.property) = "Tags"];  // unique values
  map<string, google.protobuf.Any> custom_data = 5 [(.bhom.property) = "CustomData"];  // values are BHoM messages, google.protobuf wrappers, or google.protobuf.Struct/ListValue
  // The air change rate per hour (ACH) is a value that denotes the amount of air that must be removed each hour, based on the volume of the space (1 ACH would be 1x the volume of space each hour, if the space is 1m3, it would be 1m3 of extract per hour)
  double air_change_rate = 10 [(.bhom.property) = "AirChangeRate"];
  // The continuous exhaust rate associated with a particular space type (eg pet shop, printing room) measured in m3/s*m2
  double space_type_continuous = 11 [(.bhom.property) = "SpaceTypeContinuous"];
  // The exhaust rate associated with a particular fixture type (eg toilets, showers) that is run continuously, meaning that it is not triggered by a sensor or switch and is measured in m3/s*unit
  double unit_continuous = 12 [(.bhom.property) = "UnitContinuous"];
  // The exhaust rate associated with a particular fixture type (eg toilets, showers) that is run intermittently, meaning that it is triggered by a sensor or switch and is measured in m3/s*unit
  double unit_intermittent = 13 [(.bhom.property) = "UnitIntermittent"];
}

// The fire protection attributes of a space are indicative of the hazard level of the space (which influences the sprinkler count), the sprinkler system type required, and the presence of combustible materials or sloped ceilings.
message FireProtection {
  option (.bhom.csharp_type) = "BH.oM.Environment.SpaceCriteria.FireProtection";
  string bhom_guid = 1 [(.bhom.property) = "BHoM_Guid"];
  string name = 2 [(.bhom.property) = "Name"];
  // Fragments is not exchanged: IFragment is implemented in other files.
  reserved 3;
  option (.bhom.reserved_member) = "Fragments=3";
  repeated string tags = 4 [(.bhom.property) = "Tags"];  // unique values
  map<string, google.protobuf.Any> custom_data = 5 [(.bhom.property) = "CustomData"];  // values are BHoM messages, google.protobuf wrappers, or google.protobuf.Struct/ListValue
  // Hazard Type indicates the combustibility of the materials within the space (Light, Ordinary or Extra). The indication of hazard type also determines the density of sprinklers required within the space.
  HazardType hazard_type = 10 [(.bhom.property) = "HazardType"];
  // Sprinkler System Type indicates whether the system will need to accommodate spaces that are subject to freezing (dry system type, commonly used in loading docks and parking garages), spaces that contain materials that when on fire would be spread further by water (foam system type, commonly used in a diesel generator room), spaces that contain precious materials that would be ruined by a false trip of the sprinkler system (preaction, commonly used in art galleries.)
  SprinklerSystemType sprinkler_system_type = 11 [(.bhom.property) = "SprinklerSystemType"];
  // The presence of combustible materials in the space would indicate the potential need for increasing the hazard type within the space.
  bool combustible_materials = 12 [(.bhom.property) = "CombustibleMaterials"];
  // The presence of a sloped ceiling within the space would indicate the potential need for the area of the ceiling being calculated as if it were flat (i.e. the space would require more sprinklers than by area alone.)
  bool sloped_ceiling = 13 [(.bhom.property) = "SlopedCeiling"];
  // The maximum ceiling temperature indicates the temperature rating, classification and color of the sprinklers within the space.
  double maximum_ceiling_temperature = 14 [(.bhom.property) = "MaximumCeilingTemperature"];
}

